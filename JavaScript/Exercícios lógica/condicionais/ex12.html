<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desconto do IR</title>
  </head>
  <script>
    /*Faça um programa para o cálculo de uma folha de pagamento, sabendo que os
    descontos são do Imposto de Renda, que depende do salário bruto (conforme
    tabela abaixo) e 3% para o Sindicato e que o FGTS corresponde a 11% do Salário
    Bruto, mas não é descontado (é a empresa que deposita). O Salário Líquido
    corresponde ao Salário Bruto menos os descontos. O programa deverá pedir ao
    usuário o valor da sua hora e a quantidade de horas trabalhadas no mês.

    Desconto do IR:
    ● Salário Bruto até R$ 900 (inclusive): isento;
    ● Salário Bruto até R$ 1500 (inclusive): desconto de 5%;
    ● Salário Bruto até R$ 2500 (inclusive): desconto de 10%;
    ● Salário Bruto acima de 2500 - desconto de 20%

    Imprima na tela as informações, dispostas conforme o exemplo a seguir. No
    exemplo o valor da hora é R$ 5 e a quantidade de horas trabalhadas é 220.
    Salário Bruto: R$ 5 * 220 = R$ 1100,00
    (-) IR (5%) : R$ 55,00
    (-) INSS (10%) : R$ 110,00
    (-) FGTS (11%): R$ 121,00
    Total de descontos: R$ 165,00
    Salário Líquido: R$ 935,00 */

    let valorHora = parseFloat(prompt("Informe o valor da hora trabalhada "));
    let horasTrabalhadas = parseFloat(
      prompt("Informe a quantidade de horas trabalhadas: "),
    );

    const salarioBruto = valorHora * horasTrabalhadas;

    let descontoIr = 0;

    if (salarioBruto <= 900) {
      descontoIr = 0;
    } else if (salarioBruto <= 1500) {
      descontoIr = 0.05;
    } else if (salarioBruto <= 2500) {
      descontoIr = 0.1;
    } else {
      descontoIr = 0.2;
    }

    const ir = salarioBruto * descontoIr;
    const inss = salarioBruto * 0.1;
    const fgts = salarioBruto * 0.11;
    const sindicato = salarioBruto * 0.03;
    const totalDescontos = ir + inss + sindicato;
    const salarioLiquido = salarioBruto - totalDescontos;

    console.log(
      `Salário Bruto: (${valorHora} * ${horasTrabalhadas}): R$ ${salarioBruto.toFixed(2)}`,
    );
    console.log(`(-) IR (${descontoIr * 100}%): R$ ${ir.toFixed(2)}`);
    console.log(`(-) INSS (10%): R$ ${inss.toFixed(2)}`);
    console.log(`(-) Sindicato (3%): R$ ${sindicato.toFixed(2)}`);
    console.log(`FGTS (11%): R$ ${fgts.toFixed(2)}`);
    console.log(`Total de descontos: R$ ${totalDescontos.toFixed(2)}`);
    console.log(`Salário Líquido: R$ ${salarioLiquido.toFixed(2)}`);
  </script>
  <body></body>
</html>
