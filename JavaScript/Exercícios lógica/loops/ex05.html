<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crescimento Populacional II</title>
  </head>
  <script>
    /*Altere o programa anterior permitindo ao usuário informar as populações e as taxas
de crescimento iniciais. Valide a entrada e permita repetir a operação.*/

    let repetir;

    do {
      // Entrada de dados
      let populacaoA = parseFloat(prompt("Informe a população do país A: "));
      let taxaCrescimentoA = parseFloat(
        prompt("Informe a taxa de crescimento do país A (%): "),
      );
      let populacaoB = parseFloat(prompt("Informe a população do país B: "));
      let taxaCrescimentoB = parseFloat(
        prompt("Informe a taxa de crescimento do país B (%): "),
      );

      // Validação básica
      if (
        isNaN(populacaoA) ||
        isNaN(populacaoB) ||
        isNaN(taxaCrescimentoA) ||
        isNaN(taxaCrescimentoB)
      ) {
        alert("Erro! Digite apenas números válidos.");
        continue; // Volta para o início do do...while
      }

      if (
        populacaoA <= 0 ||
        populacaoB <= 0 ||
        taxaCrescimentoA <= 0 ||
        taxaCrescimentoB <= 0
      ) {
        alert("Erro! Todos os valores devem ser positivos.");
        continue;
      }

      // Verificar se A consegue ultrapassar B
      if (populacaoA >= populacaoB) {
        alert("País A já é maior ou igual ao país B!");
        repetir = prompt("Deseja calcular novamente? (s/n)");
        continue;
      }

      if (taxaCrescimentoA <= taxaCrescimentoB) {
        alert("Taxa de A deve ser maior que B para que A ultrapasse B!");
        repetir = prompt("Deseja calcular novamente? (s/n)");
        continue;
      }

      // Converter taxas para multiplicadores
      taxaCrescimentoA = 1 + taxaCrescimentoA / 100;
      taxaCrescimentoB = 1 + taxaCrescimentoB / 100;

      let anos = 0;

      // Loop principal - calcula ano a ano
      while (populacaoA < populacaoB) {
        populacaoA *= taxaCrescimentoA;
        populacaoB *= taxaCrescimentoB;
        anos++;
        console.log(
          `Ano ${anos}: A = ${populacaoA.toFixed(0)}, B = ${populacaoB.toFixed(0)}`,
        );
      }

      // Mostrar resultado
      console.log(`\nResultado: Levou ${anos} anos para A ultrapassar B!`);
      console.log(`População final A: ${populacaoA.toFixed(0)}`);
      console.log(`População final B: ${populacaoB.toFixed(0)}`);

      // Perguntar se quer repetir
      repetir = prompt("Deseja calcular novamente? (s/n)");
    } while (repetir === "s" || repetir === "S");

    console.log("Programa encerrado!");
  </script>
  <body></body>
</html>
