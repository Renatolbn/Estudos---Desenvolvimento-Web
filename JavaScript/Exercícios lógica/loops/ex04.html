<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crescimento Populacional I</title>
  </head>
  <script>
    /*Supondo que a população de um país A seja da ordem de 80000 habitantes com
uma taxa anual de crescimento de 3% e que a população de B seja 200000
habitantes com uma taxa de crescimento de 1.5%. Faça um programa que calcule e
escreva o número de anos necessários para que a população do país A ultrapasse
ou iguale a população do país B, mantidas as taxas de crescimento.*/

    let populacaoA = 80000;
    let populacaoB = 200000;
    let anos = 0;

    while (populacaoA < populacaoB) {
      populacaoA *= 1.03;
      populacaoB *= 1.015;
      anos++;
      console.log(
        `Ano ${anos}: A = ${populacaoA.toFixed(0)}, B = ${populacaoB.toFixed(0)}`,
      );
    }
    console.log(`Resultado: Levou ${anos} anos para A ultrapassar B!`);
    console.log(`População final A: ${populacaoA.toFixed(0)}`);
    console.log(`População final B: ${populacaoB.toFixed(0)}`);
  </script>
  <body></body>
</html>
