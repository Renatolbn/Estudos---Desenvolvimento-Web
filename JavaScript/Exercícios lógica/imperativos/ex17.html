<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cálculo de Peso Ideal I</title>
  </head>
  <script>
    //Tendo como dados de entrada a altura de uma pessoa, construa um algoritmo que calcule seu peso ideal, usando a seguinte fórmula: (72.7 * altura) - 58.

    let altura = parseFloat(prompt("Informe a altura: "));
    if (isNaN(altura) || altura < 0) {
      console.log("Informe um valor válido!!");
    }
    const pesoIdeal = 72.7 * altura - 58;

    console.log(`A altura é: ${altura} e o peso ideal é: ${pesoIdeal.toFixed(2)}`,
    );
  </script>
  <body></body>
</html>
