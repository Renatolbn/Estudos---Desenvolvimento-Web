<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>O dobro da área de um Quadrado</title>
  </head>
  <script>
    /*Faça um programa que calcule a área de um quadrado, em seguida imprima o
dobro desta área para o usuário. A área de um quadrado é dada por 𝐴 , onde Aq = 𝐿², onde 𝐿 é o comprimento do lado do quadrado.*/

    let lado = parseFloat(prompt("Comprimento do lado:"));
    const area = lado * lado;
    console.log(
      "A área do quadrado é de: " +
        area +
        "m²" +
        " e o dobro da área é de: " +
        area * 2 +
        "m²"
    );
  </script>
  <body></body>
</html>
